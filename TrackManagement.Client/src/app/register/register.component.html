<main class="login-shell">
  <section class="login-intro">
    <span class="eyebrow">TAKWENE / ADMINISTRATION</span>
    <h1>Create a<br /><em>new user.</em></h1>
    <p>Create a secure account with the right access level for the music operations workspace.</p>
  </section>

  <section class="login-card">
    <div class="card-heading">
      <span class="mini-mark">T</span>
      <div><h2>Create user</h2><p>Admin access required</p></div>
    </div>

    <form (ngSubmit)="submit()">
      <label for="new-username">Username</label>
      <input id="new-username" type="text" name="username" autocomplete="username" [(ngModel)]="username" minlength="3" maxlength="100" required />

      <label for="new-password">Password</label>
      <span class="password-field">
        <input id="new-password" [type]="showPassword ? 'text' : 'password'" name="password" autocomplete="new-password" [(ngModel)]="password" minlength="8" maxlength="100" required />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [title]="showPassword ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
        </button>
      </span>
      <small class="field-hint">Use at least 8 characters.</small>

      <label for="user-role">Access role</label>
      <select id="user-role" name="role" [(ngModel)]="role" required>
          <option *ngFor="let availableRole of roles" [value]="availableRole">{{ availableRole }}</option>
      </select>

      <button type="submit" [disabled]="!canSubmit">
        {{ isSubmitting ? 'Creating user...' : 'Create user' }}
      </button>

      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </section>
</main>
