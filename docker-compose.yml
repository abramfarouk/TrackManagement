services:


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: trackmanagement-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Abram123@#"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Abram123@#' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Abram123@#' -Q 'SELECT 1'"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped



  api:
    build:
      context: .
      dockerfile: TrackManagement.API/Dockerfile

    container_name: trackmanagement-api

    environment:

      ASPNETCORE_ENVIRONMENT: Development

      ASPNETCORE_HTTP_PORTS: 8080



      ConnectionStrings__TrackManagementDb: "Server=sqlserver,1433;Database=TrackManagementDb;User Id=sa;Password=Abram123@#;TrustServerCertificate=True;MultipleActiveResultSets=True"



      Jwt__Issuer: "TrackManagement.Api"

      Jwt__Audience: "TrackManagement.Client"

      Jwt__SigningKey: "JDJALJLAMFKAKJFLKAKFLALFKLAVMOIOF6587FAFAFAJ"

      Jwt__ExpiryMinutes: "60"



      Cors__AllowedOrigins__0: "http://localhost:4200"



      DemoUser__Username: "admin"

      DemoUser__Password: "Password123@#"


    ports:
      - "44334:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped



  client:
    build:
      context: ./TrackManagement.Client
      dockerfile: Dockerfile

    container_name: trackmanagement-client

    ports:
      - "4200:80"

    depends_on:
      - api

    restart: unless-stopped



volumes:

  sqlserver_data: